<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/clearstyle.css">
  <link rel="stylesheet" href="/css/rooms.css">
  <title>Online Chat</title>
</head>

<body>
  <div class="wrapper">
    <h1 class="page-title">Онлайн чат</h1>
    <main class="main">
      <div class="rooms">
        <div class="rooms__profile profile">
          <div class="profile__user user">
            <div class="user__name"></div>
          </div>
          <div class="profile__button">
            <button>Выйти</button>
          </div>
        </div>
        <div class="rooms__title">
          <h2>Список комнат</h2>
        </div>
        <form class="rooms__createRoom create-room">
          <h2 class="create-room__title">Создайте свою комнату</h2>
          <div class="create-room__body">
            <div class="create-room__option">
              <input type="text" name="name" id="name" required placeholder="Введите имя">
            </div>
            <div class="create-room__option">
              <input type="checkbox" name="private" id="private">
              <label for="private">Сделать приватной</label>
            </div>
            <div class="create-room__option hidden">
              <input type="text" name="password" id="password" placeholder="Введите пароль" minlength="3">
            </div>
            <div class="create-room__button">
              <button>Создать комнату</button>
            </div>
          </div>
        </form>
        <div class="rooms-list"></div>
      </div>
    </main>
    <div class="modal">
      <div class="modal__body">
        <div class="modal__form">
          <form>
            <input type="text" name="room-password" id="room-password" required minlength="3"
              placeholder="Введите пароль">
            <button>Войти</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/js/rooms.js"></script>
</body>

</html>
